[project]
name = "hotel-neurosymbolique"
version = "0.1.0"
description = "Systeme de raisonnement neuro-symbolique pour l'aide a la decision critique"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RET", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/symbolique/ontologie/schema.py" = ["N801"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["owlready2.*", "clingo.*", "ortools.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "lent: test dont l'execution depasse la seconde, exclu de la boucle courte",
]
