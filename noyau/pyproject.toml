[project]
name = "hotel-neurosymbolique"
version = "0.1.0"
description = "Systeme de raisonnement neuro-symbolique pour l'aide a la decision critique"
requires-python = ">=3.11"
dependencies = [
    "clingo>=5.7",
    "fastapi>=0.115",
    "ortools>=9.11",
    "owlready2>=0.46",
    "pydantic>=2.9",
    "sentencepiece>=0.2",
    "sqlalchemy>=2.0",
    "torch>=2.5",
    "transformers>=4.45",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.11",
    "psutil>=7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Le paquet est `src` lui-meme, importe sous ce nom (`src.domaine`, ...): sa
# racine est ce dossier, et non `src/` comme dans la disposition usuelle.
# Declarer la racine rend l'installation editable lisible par les outils
# d'analyse, qui ne suivent pas les chargeurs dynamiques de setuptools.
[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RET", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/symbolique/ontologie/schema.py" = ["N801"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["owlready2.*", "clingo.*", "ortools.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "lent: test dont l'execution depasse la seconde, exclu de la boucle courte",
]
