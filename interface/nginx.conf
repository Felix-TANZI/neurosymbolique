# Diffusion de l'interface et acheminement des appels au noyau.
#
# Les appels sous /api sont transmis au noyau, ce qui evite a l'interface de
# connaitre son adresse et dispense d'une configuration CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le routage releve de l'interface: toute adresse inconnue restitue la
    # page principale, qui etablit alors l'ecran a presenter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://noyau:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Le raisonnement peut demander plusieurs secondes: un delai trop
        # court interromprait une demande en cours de traitement.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}