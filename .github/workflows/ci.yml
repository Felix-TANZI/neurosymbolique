name: CI

# La verification porte sur ce qui protege le systeme: le typage strict, les
# contrats d'architecture, la suite de tests et la construction de l'interface.
# Un deploiement ne doit pouvoir s'engager sur un etat qui n'a pas passe ces
# controles.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noyau:
    name: Noyau
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Preparer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dependances
        working-directory: noyau
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verifier le style
        working-directory: noyau
        run: ruff check src tests scripts

      - name: Verifier le typage
        working-directory: noyau
        run: mypy src tests scripts

      - name: Verifier les contrats d'architecture
        working-directory: noyau
        run: lint-imports

      - name: Executer la suite de tests
        working-directory: noyau
        run: pytest --no-cov

  interface:
    name: Interface
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Installer les dependances
        working-directory: interface
        run: npm ci

      - name: Verifier le typage et construire
        working-directory: interface
        run: npm run build

  images:
    name: Construction des images
    runs-on: ubuntu-latest
    needs: [noyau, interface]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du noyau
        run: docker build -f Dockerfile -t neuro-noyau .

      - name: Construire l'image de l'interface
        working-directory: interface
        run: docker build -t neuro-interface .